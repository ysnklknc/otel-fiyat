function fillHotels(){
  var city=$('c').value,hs=[],hsel=$('h'),prev=hsel.value;
  if(!city){
    hsel.innerHTML='<option value="">Önce şehir seçiniz</option>';hsel.disabled=true;

  hs.sort(function(a,b){return a.localeCompare(b,'tr')});
  hsel.innerHTML=hs.length?'<option value="">Tüm oteller</option>'+hs.map(function(h){return '<option value="'+esc(h)+'">'+esc(h)+'</option>'}).join(''):'<option>Veri yok</option>';
  hsel.disabled=!hs.length;
  if(prev&&hs.indexOf(prev)>-1)hsel.value=prev;
  fillMonths();
}
function fillMonths(){
  var city=$('c').value,rs=DB.filter(function(r){return r.city===city}),ms=$('m'),prev=ms.value,mh='';
  if(rs.length){
    var mn=new Date(Math.min.apply(null,rs.map(function(r){return r.from}))*DAY),
        mx=new Date(Math.max.apply(null,rs.map(function(r){return r.to}))*DAY),
        y=mn.getUTCFullYear(),mo=mn.getUTCMonth(),c=0,Y=new Date().getFullYear();
    while((y<mx.getUTCFullYear()||(y===mx.getUTCFullYear()&&mo<=mx.getUTCMonth()))&&c++<120){
      if(y===Y||y===Y+1)mh+='<option value="'+y+'-'+mo+'">'+monthLabel(y,mo)+'</option>';
      if(++mo>11){mo=0;y++}
    }
  }
  ms.innerHTML=mh||'<option>Veri yok</option>';ms.disabled=!rs.length;
  if(prev&&ms.querySelector('option[value="'+prev+'"]'))ms.value=prev;
  render();
}
function shortDay(d){return new Date(d*DAY).toLocaleDateString('tr-TR',{timeZone:'UTC',day:'numeric',month:'short'})}
function monthLabel(y,m){return new Date(Date.UTC(y,m,1)).toLocaleDateString('tr-TR',{month:'long',year:'numeric',timeZone:'UTC'})}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}

// bir otel için dönem fiyatı: her gece için kaydı bul
function quote(city,hotel,d1,d2){
  var rs=DB.filter(function(r){return r.city===city&&r.hotel===hotel}),segs=[],miss=0;
  for(var d=d1;d<d2;d++){
    var r=rs.find(function(x){return d>=x.from&&d<=x.to});
    if(!r){miss++;continue}
    var last=segs[segs.length-1];
    if(last&&last.price===r.price)last.end=d;else segs.push({from:d,end:d,price:r.price,cur:r.cur});
  }
  if(!segs.length)return{ok:false};
  return{ok:true,miss:miss,avg:segs[0].price,cur:segs[0].cur,first:segs[0].from,changes:segs.slice(1)};
}

function render(){

  if(!DB.length){out.innerHTML='';return}

  var ok=list.filter(function(x){return x.q.ok}).sort(function(a,b){return a.q.avg-b.q.avg});
  var no=list.filter(function(x){return !x.q.ok});
  var sel=hotel?list.find(function(x){return x.h===hotel}):null;
  var html='<div class="card"><span class="chip">'+esc(city)+'</span><span class="mu">'+monthLabel(+mv[0],+mv[1])+'</span>';
  if(!ok.length){out.innerHTML=html+'<div class="mu" style="margin-top:8px">Bu ay için hiçbir otelde fiyat bulunamadı.</div></div>';return}
  var lo=ok[0],hi=ok[ok.length-1],ref=(sel&&sel.q.ok)?sel:lo;
  function tiers(x){
    var t='';
    x.q.changes.forEach(function(c){t+='<div style="font-size:12px;font-weight:400;color:var(--mu)">'+shortDay(c.from)+' tarihinden itibaren yeni fiyat: <b style="color:var(--tx)">'+pr(c.price,c.cur)+'</b></div>'});
    if(x.q.first>d1)t='<div class="mu" style="font-size:12px;font-weight:400">Fiyat '+shortDay(x.q.first)+' tarihinden itibaren geçerli</div>'+t;
    return t+nh(city,x.h);
  }
  if(sel){
    html+='<div style="font-weight:600;margin-top:8px">'+esc(sel.h)+'</div>';
    if(!sel.q.ok)html+='<div class="mu" style="margin-top:4px">Bu ay için fiyat bulunamadı.</div>'+nh(city,sel.h);
    else{
      var rk=ok.indexOf(sel)+1;
      html+='<div class="big">'+pr(sel.q.avg,sel.q.cur)+' <span style="font-size:14px;font-weight:400" class="mu">/ kişi (DBL)</span></div>'+
        '<div class="mu">'+ok.length+' otel arasında <b style="color:var(--tx)">'+rk+'. sıra</b>'+(rk===1?' (en ucuz)':'')+'</div>'+tiers(sel);
    }
  }else{
    html+='<div class="mu" style="margin-top:8px;font-size:14px">En ucuz: <b style="color:var(--ac)">'+esc(lo.h)+' ('+pr(lo.q.avg,lo.q.cur)+')</b> · En pahalı: <b style="color:var(--tx)">'+esc(hi.h)+' ('+pr(hi.q.avg,hi.q.cur)+')</b></div>';
  }
  html+='</div>';
  var useSel=sel&&sel.q.ok;
  html+='<div class="card"><div style="font-weight:600;margin-bottom:8px">'+esc(city)+' — ucuzdan pahalıya (kişi başı, çift kişilik oda)</div><div class="tw"><table><thead><tr><th>#</th><th>Otel</th><th class="n">Fiyat</th><th class="n">'+(useSel?'Seçili otele göre':'En ucuza göre')+'</th></tr></thead><tbody>';
  ok.forEach(function(x,i){
    var diff=x.q.avg-ref.q.avg,pct=ref.q.avg?Math.abs(diff)/ref.q.avg*100:0,c;
    if(x===ref)c='<span class="'+(useSel?'mu':'dn')+'">'+(useSel?'seçili':'en ucuz')+'</span>';
    else if(diff===0)c='<span class="mu">aynı</span>';
    else c='<span class="'+(diff>0?'up':'dn')+'">'+(diff>0?'+':'−')+fmt(Math.abs(diff))+'</span> <span class="mu">(%'+Math.round(pct)+')</span>';
    var hl=sel?(x===sel):(i===0);
    html+='<tr class="'+(hl?'sel':'')+'"><td>'+(i+1)+'</td><td>'+esc(x.h)+tiers(x)+'</td><td class="n">'+pr(x.q.avg,x.q.cur)+'</td><td class="n">'+c+'</td></tr>';
  });
  no.forEach(function(x){html+='<tr class="'+(x===sel?'sel':'')+'"><td class="mu">–</td><td class="mu">'+esc(x.h)+nh(city,x.h)+'</td><td class="n mu" colspan="2">fiyat yok</td></tr>'});
  html+='</tbody></table></div><div class="mu" style="font-size:12px;margin-top:8px">Gösterilen fiyat ayın ilk geçerli fiyatıdır ve sıralama buna göre yapılır. Ay içinde fiyat değişiyorsa değişiklik tarihi ve yeni fiyat otelin altında not olarak yazılır.</div></div>';
  out.innerHTML=html;
}

$('c').addEventListener('change',fillHotels);$('h').addEventListener('change',render);$('m').addEventListener('change',render);
loadData();
</script>
</body>
</html>
